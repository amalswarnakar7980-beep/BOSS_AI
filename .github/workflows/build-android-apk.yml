
name: Build BOSS AI Android APK

on:
workflow_dispatch:
push:
branches:
- main
paths:
- "android-standalone/**"
- ".github/workflows/build-android-apk.yml"

permissions:
contents: read

jobs:
build-debug-apk:
name: Build Standalone Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout BOSS_AI source
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install required Android SDK packages
    run: |
      sdkmanager --install \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"

  - name: Accept Android SDK licenses
    run: yes | sdkmanager --licenses || true

  - name: Set up Gradle 8.9
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"

  - name: Verify Android project files
    working-directory: android-standalone
    run: |
      test -f settings.gradle || test -f settings.gradle.kts
      test -f app/build.gradle || test -f app/build.gradle.kts
      echo "Android project structure verified."

  - name: Build debug APK
    working-directory: android-standalone
    run: gradle --no-daemon assembleDebug

  - name: Verify generated APK
    run: |
      APK="android-standalone/app/build/outputs/apk/debug/app-debug.apk"
      test -s "$APK"
      ls -lh "$APK"
      sha256sum "$APK"

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: boss-ai-standalone-debug-apk
      path: android-standalone/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
      
          

    
